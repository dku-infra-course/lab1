# 실측 전
# 조치용 계정(선택, D3). sre-lab 안에서 Deployment patch(rollout undo, restart)만 허용한다.
# scale, delete, create, secrets, exec는 없다. 이 계정의 kubeconfig는 사람이 실행할 때만 쓴다.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-operator
  namespace: sre-lab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ai-operator-remediate
  namespace: sre-lab
rules:
  # kubectl rollout undo / restart 에 필요한 최소 권한
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "patch"]
  # rollout undo가 이전 ReplicaSet 템플릿을 읽는다
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods", "events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ai-operator-remediate
  namespace: sre-lab
subjects:
  - kind: ServiceAccount
    name: ai-operator
    namespace: sre-lab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ai-operator-remediate
