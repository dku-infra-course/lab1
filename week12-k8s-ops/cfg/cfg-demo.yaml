# 12주차 C2: 뼈대. containers 항목에 envFrom 과 env 를 직접 추가한다 (정답은 실습 가이드 C2 참고).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cfg-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cfg-demo
  template:
    metadata:
      labels:
        app: cfg-demo
    spec:
      containers:
        - name: demo
          image: <DH_USER>/k8s-demo:1.0.0
          ports:
            - containerPort: 8000
          # TODO: ConfigMap(app-config) 전체를 환경변수로, Secret(app-secret)의 DB_PASSWORD 하나를 환경변수로 주입한다.
---
apiVersion: v1
kind: Service
metadata:
  name: cfg-demo
spec:
  type: NodePort
  selector:
    app: cfg-demo
  ports:
    - port: 80
      targetPort: 8000
      nodePort: 30091
