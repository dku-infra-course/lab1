# ticket 알림 - 학생 과제
# 조건: p95(latency_p95:seconds_rate5m 기록 규칙) > 0.5초 이상 3분 지속 → ticket 알림 발송
# 사용법: 이 파일을 my-ticket-alert.yaml로 복사하고 kubectl apply -f 한다.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: my-ticket-alert
  namespace: monitoring
spec:
  groups:
    - name: my-ticket
      rules:
        - alert: PodinfoLatencyP95High
          # C1에서 적용한 기록 규칙(sre:sli_latency_p95:seconds_rate5m)이 0.5초 초과하면 알림
          expr: sre:sli_latency_p95:seconds_rate5m > 0.5
          # 3분 이상 지속되는 경우만 알림 (일시적 튐 무시)
          for: 3m
          labels:
            # ticket: 사람을 깨우지 않는 알림 (page와 구분)
            severity: ticket
          annotations:
            # 알림 화면에 표시될 제목
            summary: "Podinfo p95 > 500ms"
            # 알림 화면에 표시될 상세 메시지 ({{ $value }}는 현재 값)
            description: "Current p95: {{ $value }}s. Check dashboard B2 p95 panel."
