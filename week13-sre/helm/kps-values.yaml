# 실측 전
# kube-prometheus-stack 실습용 최소 구성. 설치:
#   helm install kps prometheus-community/kube-prometheus-stack -n monitoring --create-namespace \
#     -f kps-values.yaml --set grafana.adminPassword='<YOUR_PASSWORD>'
# 비밀번호는 파일에 적지 않고 설치 때 --set으로 준다.

# kubeadm 기본 설정에서 수집이 실패하는 대상은 끈다(노이즈 알림 방지)
kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false
kubeProxy:
  enabled: false

prometheus:
  service:
    type: NodePort
    nodePort: 30090
  prometheusSpec:
    retention: 2d
    # release 라벨이 없는 ServiceMonitor, PrometheusRule도 수집한다 (podinfo, slo-rules)
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    resources:
      requests:
        cpu: 100m
        memory: 400Mi
      limits:
        memory: 800Mi

grafana:
  service:
    type: NodePort
    nodePort: 30030
  # label grafana_dashboard=1 이 붙은 ConfigMap을 대시보드로 자동 등록한다(사이드카)
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
  # adminPassword는 설치 때 --set grafana.adminPassword='<YOUR_PASSWORD>'
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

alertmanager:
  service:
    type: NodePort
    nodePort: 30093
  alertmanagerSpec:
    resources:
      requests:
        cpu: 20m
        memory: 48Mi
      limits:
        memory: 128Mi
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: "null"
      group_by: ["alertname", "namespace"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        # Watchdog와 InfoInhibitor는 항상 울리는 점검용 알림이라 흘려보낸다
        - receiver: "null"
          matchers:
            - alertname =~ "Watchdog|InfoInhibitor"
        # 선택: page 알림을 웹훅으로 받으려면 아래 주석을 풀고 receivers도 함께 푼다
        # - receiver: "webhook-page"
        #   matchers:
        #     - severity = "page"
        #   repeat_interval: 1h
    receivers:
      - name: "null"
      # 선택: Slack 또는 Discord 웹훅. URL은 본인 것으로 바꾸고 저장소에 올리지 않는다
      # Slack:
      # - name: "webhook-page"
      #   slack_configs:
      #     - api_url: "<YOUR_WEBHOOK_URL>"
      #       channel: "#alerts"
      #       send_resolved: true
      #       title: '{{ .CommonLabels.alertname }} ({{ .Status }})'
      #       text: '{{ .CommonAnnotations.summary }}'
      # Discord: 위 Slack 블록에서 api_url만 "<YOUR_WEBHOOK_URL>/slack" 으로 바꾼다(Slack 호환 주소)

prometheusOperator:
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 128Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 10m
      memory: 24Mi
