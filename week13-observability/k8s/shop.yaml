# W13 관측 대상 앱. <DH_USER> 를 본인 Docker Hub 아이디로 바꾼다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop
  labels:
    app: shop
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shop
  template:
    metadata:
      labels:
        app: shop
    spec:
      containers:
        - name: shop
          image: <DH_USER>/k8s-demo:2.0.0
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: FAIL_RATE
              value: "0"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 300m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: shop
  labels:
    app: shop
spec:
  type: NodePort
  selector:
    app: shop
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30100
