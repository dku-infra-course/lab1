# week04 · Nginx HTTP 업스트림 로드밸런싱 (L7)
# 배치 경로: /etc/nginx/sites-available/http-lb
# 활성화:    sudo ln -s /etc/nginx/sites-available/http-lb /etc/nginx/sites-enabled/
#
# 치환 항목
#   {{WEB01_IP}} : 백엔드 웹서버 1 사설 IP (실습 기본 192.168.0.10)
#   {{WEB02_IP}} : 백엔드 웹서버 2 사설 IP (실습 기본 192.168.0.11)
#
# 이 파일은 로드밸런서(Nginx) VM 에만 배치한다. 백엔드는 Apache 다.

upstream webservers {
    # 알고리즘 (미지정 시 Round Robin)
    #   least_conn;   활성 연결 수가 가장 적은 서버 선택
    #   ip_hash;      클라이언트 IP 해시로 서버 고정 (세션 유지)

    # weight  : 성능이 좋은 서버에 더 많은 요청을 배정한다 (3:1 비율)
    # max_fails / fail_timeout : Nginx 오픈소스의 수동(passive) 헬스체크
    #   fail_timeout 구간 안에 max_fails 회 실패하면 그 서버를 제외하고,
    #   fail_timeout 이 지난 뒤 다시 시도한다.
    server {{WEB01_IP}}:80 weight=3 max_fails=3 fail_timeout=10s;
    server {{WEB02_IP}}:80 weight=1 max_fails=3 fail_timeout=10s;
}

server {
    listen 80;
    server_name localhost;

    location / {
        proxy_pass http://webservers;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# 참고 · L4(TCP) 로드밸런싱은 http 블록이 아니라 stream 블록에 쓴다.
# /etc/nginx/nginx.conf 의 최상위(http 블록과 같은 레벨)에 아래를 추가한다.
#
# stream {
#     upstream backend {
#         random;
#         server {{WEB01_IP}}:80;
#         server {{WEB02_IP}}:80;
#     }
#
#     server {
#         listen 8080;
#         proxy_pass backend;
#     }
# }
#
# 능동 헬스체크(health_check 지시어, 주기적 프로브)는 Nginx Plus(상용) 기능이다.
# 오픈소스는 위 max_fails / fail_timeout 방식의 수동 헬스체크만 제공한다.
