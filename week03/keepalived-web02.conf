# week03 · web02 (BACKUP) 용 Keepalived 설정
# 배치 경로: /etc/keepalived/keepalived.conf
#
# 치환 항목
#   {{IFACE}} : VRRP 패킷을 주고받을 인터페이스 이름 (ip link 로 확인, 보통 ens3)
#   {{VIP}}   : 가상 IP (실습 기본 192.168.0.100)
#
# web01 과 다른 값은 state, priority 두 개뿐이다.

vrrp_instance VI_1 {
    state BACKUP
    interface {{IFACE}}
    virtual_router_id 51
    priority 100
    advert_int 1
    authentication {
        auth_type PASS
        auth_pass 1234
    }
    virtual_ipaddress {
        {{VIP}}
    }
}
