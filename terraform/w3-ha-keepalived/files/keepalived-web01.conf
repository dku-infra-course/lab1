# week03 · web01 (MASTER / Active) 용 Keepalived 설정
# 배치 경로: /etc/keepalived/keepalived.conf
#
# 치환 항목
#   {{IFACE}} : VRRP 패킷을 주고받을 인터페이스 이름 (ip link 로 확인, 보통 ens3)
#   {{VIP}}   : 가상 IP (실습 기본 192.168.0.100)
#
# web02 와 반드시 같아야 하는 값: virtual_router_id, auth_pass, virtual_ipaddress
# web02 와 달라야 하는 값      : state, priority

vrrp_instance VI_1 {
    state MASTER
    interface {{IFACE}}
    virtual_router_id 51
    priority 110
    advert_int 1
    authentication {
        auth_type PASS
        auth_pass 1234
    }
    virtual_ipaddress {
        {{VIP}}
    }
}
