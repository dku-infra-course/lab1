# week03 부록 · 유니캐스트 설정 web02 (멀티캐스트가 막힌 환경에서만 사용)
#
# DKU Solid Cloud(CloudStack 격리망)에서는 기본 멀티캐스트 설정이 정상 동작하는 것으로
# 사전 검증되었다. 이 파일은 OpenStack·퍼블릭 클라우드처럼 멀티캐스트가 막힌 환경용 참고본이다.
#
# 치환 항목
#   {{IFACE}}    : 인터페이스 이름
#   {{WEB02_IP}} : 자기 자신(web02)의 사설 IP
#   {{WEB01_IP}} : 상대(web01)의 사설 IP
#   {{VIP}}      : 가상 IP
#
# web01 에서는 state=MASTER, priority=110 으로 두고
# unicast_src_ip 와 unicast_peer 를 서로 반대로 적는다.

vrrp_instance VI_1 {
    state BACKUP
    interface {{IFACE}}
    virtual_router_id 51
    priority 100
    advert_int 1
    unicast_src_ip {{WEB02_IP}}
    unicast_peer {
        {{WEB01_IP}}
    }
    authentication {
        auth_type PASS
        auth_pass 1234
    }
    virtual_ipaddress {
        {{VIP}}
    }
}
