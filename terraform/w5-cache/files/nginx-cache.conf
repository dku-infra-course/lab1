# week05 · Nginx 리버스 프록시 캐시 (최종 형태)
# 배치 경로: /etc/nginx/sites-available/backend-proxy   (캐시 서버 VM)
# 활성화:    sudo ln -s /etc/nginx/sites-available/backend-proxy /etc/nginx/sites-enabled/
#            sudo unlink /etc/nginx/sites-enabled/default
#
# 치환 항목
#   {{WEBSERVER_IP}} : 백엔드(Flask) 서버 사설 IP (실습 기본 192.168.0.10)
#
# ---------------------------------------------------------------
# 선행 작업: 캐시 존 정의는 이 파일이 아니라 /etc/nginx/nginx.conf 의
# http 블록 안에 넣어야 한다. server 블록 안이나 http 밖에 두면
# nginx -t 가 실패한다.
#
#   http {
#       ...
#       proxy_cache_path /var/cache/nginx/api_cache
#                        levels=1:2
#                        keys_zone=api_cache:10m
#                        max_size=100m
#                        inactive=60m;
#       ...
#   }
#
# 그리고 캐시 디렉터리를 만든다.
#   sudo mkdir -p /var/cache/nginx/api_cache
#
#   levels=1:2               캐시 해시를 1글자/2글자로 나눠 디렉터리 분산
#   keys_zone=api_cache:10m  캐시 키·메타데이터용 공유 메모리 10MB
#                            (1MB 당 약 8,000개 키 → 약 80,000개 URL)
#   max_size=100m            디스크 캐시 최대 크기
#   inactive=60m             60분간 접근 없으면 자동 삭제
# ---------------------------------------------------------------

server {
    listen 80;
    server_name _;

    # Part 4 · 리버스 프록시 캐시 + 조건부 캐싱 + stale 캐시
    location /api/products {
        proxy_pass http://{{WEBSERVER_IP}}:5000/api/products;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_cache api_cache;
        proxy_cache_methods GET HEAD;

        # 실습 관찰을 쉽게 하려고 10초로 둔다.
        # 조건부 캐싱 단계까지는 10m 으로 두고 확인해도 된다.
        proxy_cache_valid 200 10s;

        # 쿼리 파라미터 nocache 가 있으면 캐시를 우회한다.
        #   time curl -I "http://localhost/api/products?nocache=1"   항상 MISS
        #   time curl -I "http://localhost/api/products"             두 번째부터 HIT
        proxy_cache_bypass $arg_nocache;
        proxy_no_cache     $arg_nocache;

        # 백엔드 장애 시 만료된 캐시라도 제공한다 (Graceful Degradation).
        proxy_cache_use_stale error timeout http_500 http_502 http_503;

        add_header X-Cache-Status $upstream_cache_status;
    }

    # Part 6 · Nginx(10초) + Redis(30초) 이중 캐싱
    # Nginx TTL < Redis TTL 로 두어, Nginx 만료 시 Redis 가 2차 방어선이 된다.
    location /api/products-dual {
        proxy_pass http://{{WEBSERVER_IP}}:5000/api/products-dual;
        proxy_set_header Host $host;

        proxy_cache api_cache;
        proxy_cache_valid 200 10s;

        add_header X-Cache-Status $upstream_cache_status;
        add_header X-Cache-Layer "nginx+redis";
    }

    # Part 3 · Redis 캐시만 확인할 때 쓰는 경로 (Nginx 캐시 없음)
    location /api/products-cached {
        proxy_pass http://{{WEBSERVER_IP}}:5000/api/products-cached;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# 적용
#   sudo nginx -t
#   sudo systemctl reload nginx
#
# 캐시 파일 확인
#   sudo ls -lR /var/cache/nginx/api_cache/
#
# 캐시 수동 무효화
#   sudo rm -rf /var/cache/nginx/api_cache/*
