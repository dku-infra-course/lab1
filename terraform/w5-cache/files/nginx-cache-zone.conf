# week05 · Nginx 캐시 존 정의
#
# proxy_cache_path 는 http 블록 안에 있어야 한다. Ubuntu 의 /etc/nginx/nginx.conf 는
# http 블록에서 /etc/nginx/conf.d/*.conf 를 include 하므로, 이 파일을
# /etc/nginx/conf.d/api-cache-zone.conf 로 두면 nginx.conf 를 직접 고치지 않아도 된다.
#
# 실습 가이드는 nginx.conf 의 http 블록을 직접 편집하는 방법을 가르친다.
# 이 파일은 강사가 preinstall_cache_config = true 로 사전 상태를 만들 때만 쓴다.
#
#   levels=1:2               캐시 해시를 1글자/2글자로 나눠 디렉터리 분산
#   keys_zone=api_cache:10m  캐시 키·메타데이터용 공유 메모리 10MB
#   max_size=100m            디스크 캐시 최대 크기
#   inactive=60m             60분간 접근 없으면 자동 삭제

proxy_cache_path /var/cache/nginx/api_cache
                 levels=1:2
                 keys_zone=api_cache:10m
                 max_size=100m
                 inactive=60m;
